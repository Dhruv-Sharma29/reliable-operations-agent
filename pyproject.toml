[project]
name = "ops-agent"
version = "0.1.0"
description = "Reliable operations agent: sandbox target app, fault injection, baseline, evaluation (portfolio project 02)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
